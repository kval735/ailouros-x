<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ailouros X</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME: PINK (default) ── */
    :root {
      --bg:        #fce8f0;
      --bg2:       #f9dde9;
      --surface:   #fff5f9;
      --surface2:  #ffeef5;
      --border:    #f0c8dd;

      --text:      #411E57;
      --text2:     #872D72;
      --muted:     #b8849e;

      --pink:      #DE5C8F;
      --pink-soft: #EDABBE;
      --rose:      #DE5C8F;
      --lavender:  #c9aee8;
      --lilac:     #dfc5f5;
      --purple:    #7C4EBB;
      --yellow:    #f9e07a;
      --peach:     #f9c497;
      --mint:      #a8e6c8;
      --sky:       #b0d9f5;
      --coral:     #f5a09a;

      --radius: 18px;
      --ui:       'Aptos', 'Segoe UI', sans-serif;
      --serif:    'Aptos', 'Segoe UI', sans-serif;
      --logo:     'Abril Fatface', fantasy;
      --broadway: 'Abril Fatface', fantasy;

      --btn-grad: #7C4EBB;
      --btn-shadow: rgba(124,78,187,0.20);
      --tbtn-grad: #f9d050;
      --tbtn-color: #5a3e00;
      --tbtn-shadow: rgba(249,208,80,0.20);
      --header-bg: #E8D5F8;
      --header-text: #411E57;
      --panel-bg: #fff5fa;
      --compose-bg: #fff0f7;
      --thoughts-bg: #fff5fa;
    }

    /* ── PINK THEME: POLKA DOT GLITTER ON HEADER ── */

    @keyframes pink-glitter {
      0%   { opacity: 0.12; }
      50%  { opacity: 0.55; }
      100% { opacity: 0.12; }
    }

    body:not([data-theme]) header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,215,0,0.92) 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.98) 1px,   transparent 1px),
        radial-gradient(circle, rgba(255,160,200,0.75) 1px,  transparent 1px);
      background-size: 46px 46px, 28px 28px, 37px 37px;
      background-position: 8px 8px, 14px 21px, 23px 5px;
      animation: pink-glitter 2.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* ── THEME: GLAM (placeholder — same as pink for now) ── */
    body[data-theme="glam"] {
      --bg:        #fce8f0;
      --bg2:       #f9dde9;
      --surface:   #fff5f9;
      --surface2:  #ffeef5;
      --border:    #f0c8dd;

      --text:      #411E57;
      --text2:     #872D72;
      --muted:     #b8849e;

      --pink:      #DE5C8F;
      --pink-soft: #EDABBE;
      --rose:      #DE5C8F;
      --lavender:  #c9aee8;
      --lilac:     #dfc5f5;
      --purple:    #7C4EBB;
      --yellow:    #f9e07a;
      --peach:     #f9c497;
      --mint:      #a8e6c8;
      --sky:       #b0d9f5;
      --coral:     #f5a09a;

      --btn-grad: #7C4EBB;
      --btn-shadow: rgba(124,78,187,0.20);
      --tbtn-grad: #f9d050;
      --tbtn-color: #5a3e00;
      --tbtn-shadow: rgba(249,208,80,0.20);
      --header-bg: #E8D5F8;
      --header-text: #411E57;
      --panel-bg: #fff5fa;
      --compose-bg: #fff0f7;
      --thoughts-bg: #fff5fa;
    }

    /* ── THEME: GOLD ── */
    body[data-theme="gold"] {
      --bg:        #FFFBEB;
      --bg2:       #FFF4CC;
      --surface:   #FFFEF5;
      --surface2:  #FFF8D8;
      --border:    #F0D050;

      --text:      #3A2A00;
      --text2:     #7A5200;
      --muted:     #B88C30;

      --pink:      #EFB923;
      --pink-soft: #FFD860;
      --rose:      #D4980A;
      --lavender:  #9F5E33;
      --lilac:     #F5E060;
      --purple:    #9F5E33;
      --yellow:    #FEE528;
      --peach:     #FFD314;
      --mint:      #C8D060;
      --sky:       #F5E888;
      --coral:     #F5A840;

      --btn-grad: #9F5E33;
      --btn-shadow: rgba(159,94,51,0.20);
      --tbtn-grad: #EFB923;
      --tbtn-color: #3A2800;
      --tbtn-shadow: rgba(239,185,35,0.20);
      --header-bg: #FCDBA8;
      --header-text: #7A5200;
      --panel-bg: #FFFBEB;
      --compose-bg: #FFF8E0;
      --thoughts-bg: #FFFBEB;
    }


    body[data-theme="gold"] .essay-card               { --c: #EFB923; --cb: #FFF5D0; }
    body[data-theme="gold"] .essay-card:nth-child(2n) { --c: #9F5E33; --cb: #F5E8D5; }
    body[data-theme="gold"] .essay-card:nth-child(3n) { --c: #D4980A; --cb: #FFF0B0; }
    body[data-theme="gold"] .essay-card:nth-child(4n) { --c: #C8D050; --cb: #F5F0C0; }
    body[data-theme="gold"] .essay-card:nth-child(5n) { --c: #F5A840; --cb: #FEF0D5; }
    body[data-theme="gold"] .essay-card:nth-child(6n) { --c: #FFD314; --cb: #FFFAD0; }
    body[data-theme="gold"] .essay-card:nth-child(7n) { --c: #9F5E33; --cb: #F5E8D5; }

    body[data-theme="gold"] .thought-card               { --c: #EFB923; --cb: #FFF5D0; }
    body[data-theme="gold"] .thought-card:nth-child(2n) { --c: #FFD314; --cb: #FFFAD0; }
    body[data-theme="gold"] .thought-card:nth-child(3n) { --c: #F5E060; --cb: #FFFCE0; }
    body[data-theme="gold"] .thought-card:nth-child(4n) { --c: #C8D050; --cb: #F5F0C0; }
    body[data-theme="gold"] .thought-card:nth-child(5n) { --c: #F5A840; --cb: #FEF0D5; }
    body[data-theme="gold"] .thought-card:nth-child(6n) { --c: #9F5E33; --cb: #F5E8D5; }

    /* ── THEME: PURPLE ── */
    body[data-theme="purple"] {
      --bg:        #F0E8FF;
      --bg2:       #E8D8FF;
      --surface:   #F9F4FF;
      --surface2:  #F2E8FF;
      --border:    #C8A0F8;

      --text:      #1E0A3C;
      --text2:     #4A1870;
      --muted:     #9060C0;

      --pink:      #A040E8;
      --pink-soft: #C890F8;
      --rose:      #8020D0;
      --lavender:  #B870F0;
      --lilac:     #DDB8FF;
      --purple:    #7020D0;
      --yellow:    #E8C8FF;
      --peach:     #D098FF;
      --mint:      #A0B8FF;
      --sky:       #B8A8FF;
      --coral:     #E870C8;

      --btn-grad: #7020D0;
      --btn-shadow: rgba(107,16,208,0.20);
      --tbtn-grad: #A040E8;
      --tbtn-color: #fff;
      --tbtn-shadow: rgba(160,64,232,0.20);
      --header-bg: #D8B8FF;
      --header-text: #2A0860;
      --panel-bg: #F2EAFF;
      --compose-bg: #EDE0FF;
      --thoughts-bg: #F2EAFF;
    }


    body[data-theme="purple"] .essay-card               { --c: #A040E8; --cb: #F0E0FF; }
    body[data-theme="purple"] .essay-card:nth-child(2n) { --c: #7020D0; --cb: #E8D0FF; }
    body[data-theme="purple"] .essay-card:nth-child(3n) { --c: #B870F0; --cb: #EDD8FF; }
    body[data-theme="purple"] .essay-card:nth-child(4n) { --c: #8050C0; --cb: #E5D8F8; }
    body[data-theme="purple"] .essay-card:nth-child(5n) { --c: #E870C8; --cb: #FFE0F5; }
    body[data-theme="purple"] .essay-card:nth-child(6n) { --c: #5010B8; --cb: #DDD0FF; }
    body[data-theme="purple"] .essay-card:nth-child(7n) { --c: #A040D8; --cb: #ECD5FF; }

    body[data-theme="purple"] .thought-card               { --c: #A040E8; --cb: #F0E0FF; }
    body[data-theme="purple"] .thought-card:nth-child(2n) { --c: #C890F8; --cb: #F5E8FF; }
    body[data-theme="purple"] .thought-card:nth-child(3n) { --c: #DDB8FF; --cb: #F8F0FF; }
    body[data-theme="purple"] .thought-card:nth-child(4n) { --c: #8050C0; --cb: #E5D8F8; }
    body[data-theme="purple"] .thought-card:nth-child(5n) { --c: #E870C8; --cb: #FFE0F5; }
    body[data-theme="purple"] .thought-card:nth-child(6n) { --c: #7020D0; --cb: #E8D0FF; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
    }

    body::before { display: none; }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      height: 115px;
      background: var(--header-bg);
      border-bottom: 4px solid var(--pink-soft);
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }

    /* ── HEADER CENTER ── */
    .header-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* ── THEME BUTTONS (mascots, right side) ── */
    .theme-buttons {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
    }

    .theme-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      display: block;
      line-height: 0;
      transition: filter 0.2s;
    }

    .theme-btn img {
      height: 92px;
      width: auto;
      display: block;
    }

    .theme-btn:hover { opacity: 0.85; }

    .theme-btn.active {
      filter:
        drop-shadow(1px 0 0 white)
        drop-shadow(-1px 0 0 white)
        drop-shadow(0 -1px 0 white)
        drop-shadow(-1px -1px 0 white)
        drop-shadow(1px -1px 0 white)
        drop-shadow(0 -2px 5px rgba(255,255,255,0.85));
    }

    .tagline {
      font-size: 0.70rem;
      font-style: italic;
      color: var(--header-text, rgba(255,255,255,0.85));
      white-space: nowrap;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .logo-img {
      height: 82px;
      width: auto;
      mix-blend-mode: multiply;
      user-select: none;
      pointer-events: none;
    }

    /* ── LAYOUT ── */
    .workspace {
      display: flex;
      height: calc(100vh - 115px);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .essays-panel   { flex: 3; border-right: 8px solid var(--pink-soft); }
    .thoughts-panel { flex: 1; background: var(--thoughts-bg); }

    /* ── PANEL HEADER ── */
    .panel-header {
      padding: 12px 22px;
      border-bottom: 4px solid var(--pink-soft);
      background: var(--panel-bg);

      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .panel-title {
      font-family: var(--logo);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .pill {
      font-size: 0.66rem;
      font-weight: 800;
      padding: 3px 11px;
      border-radius: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── FEED ── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--pink-soft) transparent;
    }

    .feed::-webkit-scrollbar       { width: 5px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb { background: var(--pink-soft); border-radius: 10px; }

    .feed-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* ── ESSAY CARDS ── */
    .essay-card               { --c: var(--pink);    --cb: #fce0ea; }
    .essay-card:nth-child(2n) { --c: var(--lavender); --cb: #ede0f8; }
    .essay-card:nth-child(3n) { --c: #e8c44a;         --cb: #fdf5d0; }
    .essay-card:nth-child(4n) { --c: var(--mint);     --cb: #daf5ec; }
    .essay-card:nth-child(5n) { --c: var(--peach);    --cb: #fdeedd; }
    .essay-card:nth-child(6n) { --c: var(--sky);      --cb: #dff0fc; }
    .essay-card:nth-child(7n) { --c: var(--purple);   --cb: #ecddf8; }

    .essay-card {
      position: relative;
      background: #fff;
      border-radius: var(--radius);
      border: 2px solid var(--cb);
      border-left: 6px solid var(--c);
      padding: 20px 22px;
      box-shadow: 0 3px 14px rgba(220,140,170,0.10);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .essay-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(200,120,170,0.18);
    }

    /* ── BANANA STRIP ── */
    .banana-strip {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.05rem;
      line-height: 1;
      letter-spacing: -2px;
      pointer-events: none;
      max-width: 180px;
      word-break: break-all;
    }

    .thought-banana-strip {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      letter-spacing: -2px;
      pointer-events: none;
      max-width: 90px;
      white-space: nowrap;
    }

    /* ── THOUGHT CARDS ── */
    .thought-card               { --c: var(--yellow);   --cb: #fffae0; }
    .thought-card:nth-child(2n) { --c: var(--pink-soft); --cb: #ffeef5; }
    .thought-card:nth-child(3n) { --c: var(--lilac);    --cb: #f5eeff; }
    .thought-card:nth-child(4n) { --c: var(--mint);     --cb: #e8faf3; }
    .thought-card:nth-child(5n) { --c: var(--peach);    --cb: #fff0e5; }
    .thought-card:nth-child(6n) { --c: var(--sky);      --cb: #e8f4fd; }

    .thought-card {
      position: relative;
      background: var(--cb);
      border-radius: var(--radius);
      border: 2px solid var(--c);
      padding: 14px 15px 12px;
      box-shadow: 0 2px 10px rgba(200,140,180,0.10);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .thought-actions {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }

    .thought-card:hover {
      transform: translateY(-2px) rotate(0.5deg);
      box-shadow: 0 8px 22px rgba(180,120,160,0.18);
    }

    /* ── META ROW ── */
    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }


    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-family: var(--ui);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .comment-item .avatar {
      width: 28px;
      height: 28px;
      font-size: 0.6rem;
      flex-shrink: 0;
    }

    .meta-info { flex: 1; min-width: 0; }

    .meta-name {
      font-family: var(--logo);
      font-size: 0.83rem;
      font-weight: 800;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-time {
      font-family: var(--broadway);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
    }

    .essay-card h3 {
      font-family: var(--logo);
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card-body {
      font-family: var(--ui);
      font-size: 0.87rem;
      line-height: 1.7;
      color: var(--text2);
      white-space: pre-wrap;
      word-break: break-word;
      font-style: italic;
    }

    .card-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .thought-body-text {
      font-family: var(--ui);
      font-size: 0.87rem;
      line-height: 1.7;
      color: var(--text2);
      white-space: pre-wrap;
      word-break: break-word;
      font-style: italic;
    }

    .read-more {
      margin-top: 8px;
      background: none;
      border: none;
      color: var(--purple);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 800;
      font-family: var(--broadway);
      padding: 0;
      letter-spacing: 0.04em;
      transition: opacity 0.15s;
    }

    .read-more:hover { opacity: 0.65; }

    /* ── CARD ACTIONS ── */
    .card-divider {
      height: 1px;
      background: var(--cb);
      margin: 12px -22px;
    }

    .thought-divider {
      height: 1px;
      background: var(--c);
      opacity: 0.3;
      margin: 10px -15px;
    }

    .card-actions, .thought-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .thought-actions { justify-content: flex-start; }

    .like-btn {
      background: none;
      border: 2px solid var(--cb);
      border-radius: 20px;
      padding: 4px 13px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text2);
      font-family: var(--broadway);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .like-btn:hover:not(.liked) {
      background: #fffae0;
      border-color: var(--yellow);
      transform: scale(1.06);
    }

    .like-btn.liked {
      background: #fffae0;
      border-color: var(--yellow);
      color: #7a5800;
    }

    .thought-card .like-btn { font-size: 0.72rem; padding: 3px 10px; }

    .comments-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      font-family: var(--broadway);
      letter-spacing: 0.02em;
      transition: color 0.15s;
      padding: 4px 0;
    }

    .comments-toggle:hover { color: var(--purple); }

    /* ── COMMENTS SECTION ── */
    .comments-section {
      margin-top: 14px;
      border-top: 1px dashed var(--cb);
      padding-top: 12px;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .comments-empty {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 6px 0;
    }

    .comment-item {
      display: flex;
      gap: 8px;
    }


    .comment-content { flex: 1; min-width: 0; }

    .comment-meta {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }

    .comment-name {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--text2);
    }

    .comment-time {
      font-size: 0.62rem;
      color: var(--muted);
    }

    .comment-body {
      font-family: var(--ui);
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-compose {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px dashed var(--cb);
      padding-top: 10px;
    }

    .comment-compose input,
    .comment-compose textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: var(--ui);
      font-size: 0.8rem;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
    }

    .comment-compose input:focus,
    .comment-compose textarea:focus { border-color: var(--pink); }

    .comment-compose textarea { resize: none; height: 54px; }

    .comment-post-btn {
      align-self: flex-end;
      border: none;
      border-radius: 20px;
      padding: 5px 18px;
      font-size: 0.74rem;
      font-family: var(--broadway);
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--btn-grad);
      transition: transform 0.15s, opacity 0.15s;
    }

    .comment-post-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .comment-post-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── COMPOSE TAB ── */
    .compose-tab {
      border: none;
      border-top: 4px solid var(--pink-soft);
      width: 100%;
      padding: 11px 20px;
      background: var(--compose-bg);

      cursor: pointer;
      font-family: var(--logo);
      font-size: 0.88rem;
      color: var(--purple);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .compose-tab:hover { filter: brightness(0.97); }

    .tab-arrow {
      display: inline-block;
      transition: transform 0.35s;
      font-style: normal;
    }

    .compose-tab.open .tab-arrow { transform: rotate(180deg); }

    .compose-drawer {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .compose-drawer.open { max-height: 600px; }

    .compose-area {
      border-top: 4px solid var(--pink-soft);
      background: var(--compose-bg);

      padding: 16px 20px;
    }

    .compose-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .field-wrap { flex: 1; }

    .compose-label {
      display: block;
      font-family: var(--broadway);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .compose-input {
      width: 100%;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 8px 12px;
      font-family: var(--ui);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .compose-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .compose-textarea {
      width: 100%;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-family: var(--ui);
      font-size: 0.9rem;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .compose-textarea:focus {
      border-color: var(--lavender);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .thoughts-compose .compose-textarea { resize: none; height: 72px; }
    .thoughts-compose .compose-textarea:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .compose-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .counter { font-family: var(--broadway); font-size: 0.7rem; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; }
    .counter.warn { color: #d4940a; }
    .counter.over { color: #d94040; }

    /* ── HEADER RIGHT GROUP ── */
    .header-right-group {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .glam-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      background: linear-gradient(135deg, #DE5C8F, #7C4EBB);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .glam-circle-btn:hover { transform: scale(1.1); }
    .glam-circle-btn.active {
      box-shadow: 0 0 0 3px white, 0 0 10px rgba(255,255,255,0.5);
    }

    .header-btns {
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 79px;
    }

    .header-action-btn {
      flex: 1;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 12px;
      font-family: var(--broadway);
      font-size: 0.64rem;
      cursor: pointer;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: transform 0.15s, opacity 0.15s;
    }
    .header-action-btn:hover { transform: scale(1.04); opacity: 0.92; }
    .header-action-btn.info-btn { background: var(--pink); }

    /* ── SHARED MODAL STYLES ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #f5f0ff;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.35);
      width: 94vw;
      max-width: 1100px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: var(--broadway);
      font-size: 1.1rem;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    /* ── WHITEBOARD FRAME ── */
    .whiteboard-frame {
      background: #7B4F2E;
      border-radius: 10px;
      padding: 14px 14px 32px 14px;
      box-shadow:
        inset 0 3px 6px rgba(0,0,0,0.35),
        inset 0 -2px 4px rgba(255,255,255,0.1),
        0 6px 20px rgba(0,0,0,0.25);
      position: relative;
    }

    /* chalk tray */
    .whiteboard-frame::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 14px;
      right: 14px;
      height: 12px;
      background: #5a3820;
      border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    #wallCanvas {
      border-radius: 6px;
      cursor: crosshair;
      display: block;
      width: 100%;
      touch-action: none;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.12);
    }

    .wall-footer {
      font-family: var(--broadway);
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── INFO MODAL ── */
    .info-content {
      font-family: var(--ui);
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.7;
      padding: 10px 4px;
    }

    /* ── AVATAR EMOJI PICKER ── */
    .avatar-picker-wrap {
      position: relative;
      display: flex;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .avatar-pick-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px dashed var(--pink);
      background: var(--surface);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
    }

    .avatar-pick-btn::after {
      content: '✎';
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 0.55rem;
      background: var(--pink);
      color: #fff;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .avatar-pick-btn:hover { border-color: var(--rose); transform: scale(1.08); }

    .avatar-dropdown {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 4px;
      flex-wrap: wrap;
      width: 148px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.14);
    }

    .avatar-dropdown.open { display: flex; }

    /* opens downward (for compose drawer where upward is clipped) */
    .avatar-dropdown.drops-down {
      bottom: auto;
      top: calc(100% + 8px);
    }

    .emoji-opt {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      border-radius: 8px;
      padding: 3px 5px;
      transition: background 0.1s;
      line-height: 1;
    }

    .emoji-opt:hover { background: var(--bg2); }

    .avatar.is-emoji {
      background: var(--surface2);
      font-size: 1.15rem;
      border: 2px solid var(--border);
      color: inherit;
      line-height: 1;
    }

    /* ── Buttons ── */
    .post-btn {
      border: none;
      border-radius: 50px;
      padding: 9px 26px;
      font-size: 0.82rem;
      font-family: var(--broadway);
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      color: #fff;
      background: var(--btn-grad);
      box-shadow: 0 4px 14px var(--btn-shadow);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .post-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px var(--btn-shadow);
    }

    .post-btn:active:not(:disabled) { transform: scale(0.95); }
    .post-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .thought-btn {
      background: var(--tbtn-grad);
      box-shadow: 0 4px 14px var(--tbtn-shadow);
      color: var(--tbtn-color);
      text-shadow: none;
    }

    .thought-btn:hover:not(:disabled) {
      box-shadow: 0 8px 22px var(--tbtn-shadow);
    }

    .thoughts-compose {
      border-top: 4px solid var(--pink-soft);
      background: var(--compose-bg);

      padding: 14px 16px;
      flex-shrink: 0;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- Graffiti Wall Modal -->
<div class="modal-overlay" id="wallOverlay">
  <div class="modal-box" style="position:relative;">
    <button class="modal-close" id="wallClose" style="position:absolute;top:10px;right:14px;z-index:2;">&times;</button>
    <div class="whiteboard-frame">
      <canvas id="wallCanvas" height="625"></canvas>
    </div>
    <div class="wall-footer">Leave your mark.</div>
  </div>
</div>

<!-- Info Modal -->
<div class="modal-overlay" id="infoOverlay">
  <div class="modal-box" style="max-width:700px;">
    <div class="modal-header">
      <span class="modal-title">DA FAQ?</span>
      <button class="modal-close" id="infoClose">&times;</button>
    </div>
    <div class="info-content">
      <p>More info coming soon...</p>
    </div>
  </div>
</div>

<header>
  <div class="header-right-group">
    <button class="glam-circle-btn" id="glamBtn" title="Glam">✨</button>
    <div class="header-btns">
      <button class="header-action-btn" id="wallBtn">✏️ The Wall</button>
      <button class="header-action-btn info-btn" id="infoBtn">DA FAQ?</button>
    </div>
  </div>
  <div class="header-center">
    <img class="logo-img" id="logoImg" src="fontbolt.png" alt="Ailouros X" />
    <p class="tagline">"Curiosity may have killed the cat, but it didn't kill the monkey......oh oh ah ah" &mdash; Ruby</p>
  </div>
  <div class="theme-buttons">
    <button class="theme-btn" id="rubyBtn" data-theme="pink" title="Pink"><img src="r.png" alt="Ruby" /></button>
    <button class="theme-btn" data-theme="gold" title="Gold"><img src="k.png" alt="Gold" /></button>
    <button class="theme-btn" data-theme="purple" title="Purple"><img src="i.png" alt="Purple" /></button>
  </div>
</header>

<div class="workspace">

  <!-- LEFT: Deep Dives -->
  <section class="panel essays-panel">
    <div class="panel-header">
      <span class="panel-title" style="color:var(--purple)">Deep Dives</span>
      <span class="pill" style="background:var(--lilac);color:var(--purple);">up to 1000 words</span>
    </div>

    <div class="feed" id="essays-feed">
      <div class="feed-empty" id="essays-empty">
        <span>No yarns yet — be the first to write!</span>
      </div>
    </div>

    <button class="compose-tab" id="compose-tab">
      Write a Deep Dive <i class="tab-arrow">&#9650;</i>
    </button>

    <div class="compose-drawer" id="compose-drawer">
      <div class="compose-area">
        <div class="compose-row">
          <div class="avatar-picker-wrap">
            <button class="avatar-pick-btn" id="essay-avatar-btn" title="Pick avatar"></button>
            <div class="avatar-dropdown drops-down" id="essay-avatar-dd"></div>
          </div>
          <div class="field-wrap">
            <label class="compose-label" for="essay-name">Your name or alias</label>
            <input class="compose-input" id="essay-name" type="text" placeholder="anonymous" maxlength="40" />
          </div>
          <div class="field-wrap">
            <label class="compose-label" for="essay-title">Title</label>
            <input class="compose-input" id="essay-title" type="text" placeholder="Give your yarn a title..." maxlength="120" />
          </div>
        </div>
        <label class="compose-label" for="essay-body">Your yarn</label>
        <textarea class="compose-textarea" id="essay-body" rows="5" placeholder="What's been on your mind? Write it out..."></textarea>
        <div class="compose-footer">
          <span class="counter" id="essay-counter">0 / 1000 words</span>
          <button class="post-btn" id="essay-post-btn" disabled>Post</button>
        </div>
      </div>
    </div>
  </section>

  <!-- RIGHT: Ponders -->
  <section class="panel thoughts-panel">
    <div class="panel-header">
      <span class="panel-title" style="color:var(--purple)">Ponders</span>
    </div>

    <div class="feed" id="thoughts-feed">
      <div class="feed-empty" id="thoughts-empty">
        <span>No thoughts yet!</span>
      </div>
    </div>

    <div class="thoughts-compose">
      <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;">
        <div class="avatar-picker-wrap">
          <button class="avatar-pick-btn" id="thought-avatar-btn" title="Pick avatar"></button>
          <div class="avatar-dropdown" id="thought-avatar-dd"></div>
        </div>
        <div class="field-wrap" style="flex:1;margin:0;">
          <label class="compose-label" for="thought-name">Your name or alias</label>
          <input class="compose-input" id="thought-name" type="text" placeholder="anonymous" maxlength="40" />
        </div>
      </div>
      <label class="compose-label" for="thought-body">Drop a thought...</label>
      <textarea class="compose-textarea" id="thought-body" placeholder="What just crossed your mind?"></textarea>
      <div class="compose-footer">
        <span class="counter" id="thought-counter">0 / 280</span>
        <button class="post-btn thought-btn" id="thought-post-btn" disabled>Post</button>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function timeAgo(iso) {
    const d = Date.now() - new Date(iso).getTime();
    const m = Math.floor(d / 60000);
    if (m < 1)  return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }


  function wordCount(t) {
    return t.trim() === '' ? 0 : t.trim().split(/\s+/).length;
  }

  let essays  = [];
  let thoughts = [];

  function initials(name) {
    return (name || 'A').trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  // ── AVATAR EMOJI PICKER ───────────────────────────────────────
  const EMOJIS = ['🐒','🦊','🐱','🐸','🦋','🌸','🔥','👾','🎭','🦁','🌙','⭐'];

  function avatarDiv(item) {
    if (item.avatar) return `<div class="avatar is-emoji">${item.avatar}</div>`;
    return `<div class="avatar">${escHtml(initials(item.name))}</div>`;
  }

  function buildPicker(btnEl, ddEl) {
    ddEl.innerHTML = EMOJIS.map(e =>
      `<button class="emoji-opt" data-emoji="${e}">${e}</button>`
    ).join('');
    const saved = localStorage.getItem('avatarEmoji') || EMOJIS[0];
    btnEl.textContent = saved;
    ddEl.querySelectorAll('.emoji-opt').forEach(opt => {
      opt.addEventListener('click', () => {
        const emoji = opt.dataset.emoji;
        localStorage.setItem('avatarEmoji', emoji);
        syncAllPickers(emoji);
        ddEl.classList.remove('open');
      });
    });
    btnEl.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.avatar-dropdown').forEach(d => {
        if (d !== ddEl) d.classList.remove('open');
      });
      ddEl.classList.toggle('open');
    });
  }

  function syncAllPickers(emoji) {
    document.querySelectorAll('.avatar-pick-btn').forEach(b => b.textContent = emoji);
  }

  document.addEventListener('click', () =>
    document.querySelectorAll('.avatar-dropdown').forEach(d => d.classList.remove('open'))
  );

  buildPicker($('essay-avatar-btn'), $('essay-avatar-dd'));
  buildPicker($('thought-avatar-btn'), $('thought-avatar-dd'));

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── THEME SWITCHER ────────────────────────────────────────────
  function applyTheme(name) {
    if (name === 'pink') {
      delete document.body.dataset.theme;
    } else {
      document.body.dataset.theme = name;
    }
    localStorage.setItem('theme', name);
    document.querySelectorAll('.theme-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === name)
    );
    const glamBtn = document.getElementById('glamBtn');
    if (glamBtn) glamBtn.classList.toggle('active', name === 'glam');
    if (typeof renderEssays === 'function' && typeof essays !== 'undefined' && essays.length) renderEssays();
    if (typeof renderThoughts === 'function' && typeof thoughts !== 'undefined' && thoughts.length) renderThoughts();
  }

  document.querySelectorAll('.theme-btn').forEach(b =>
    b.addEventListener('click', () => applyTheme(b.dataset.theme))
  );

  document.getElementById('glamBtn').addEventListener('click', () => applyTheme('glam'));

  applyTheme(localStorage.getItem('theme') || 'pink');

  // ── LIKES (localStorage) ──────────────────────────────────────
  function getLiked(key) {
    return JSON.parse(localStorage.getItem(key) || '[]');
  }
  function isLiked(key, id) { return getLiked(key).includes(id); }
  function markLiked(key, id) {
    const arr = getLiked(key);
    if (!arr.includes(id)) { arr.push(id); localStorage.setItem(key, JSON.stringify(arr)); }
  }

  function likeEmoji() {
    const t = document.body.dataset.theme;
    if (t === 'gold')   return '\u{1F34C}';  // banana
    if (t === 'purple') return '\u{1F49C}';  // purple heart
    return '\u{2B50}';                         // star (pink theme)
  }

  function renderLikes(count, max) {
    if (!count) return '';
    const e = likeEmoji();
    if (count <= max) return e.repeat(count);
    return e + '\u00D7' + count;
  }

  // ── COMPOSE DRAWER ────────────────────────────────────────────
  const composeTab    = $('compose-tab');
  const composeDrawer = $('compose-drawer');

  composeTab.addEventListener('click', () => {
    const open = composeDrawer.classList.toggle('open');
    composeTab.classList.toggle('open', open);
  });

  // ── ESSAYS ────────────────────────────────────────────────────

  async function fetchEssays() {
    try {
      const r = await fetch('/api/essays');
      essays = await r.json();
      renderEssays();
    } catch (e) { console.error(e); }
  }

  function renderEssays() {
    const feed = $('essays-feed');
    $('essays-empty').style.display = essays.length ? 'none' : 'flex';
    feed.querySelectorAll('.essay-card').forEach(el => el.remove());

    essays.forEach(e => {
      const card = document.createElement('div');
      card.className = 'essay-card';
      const wc    = wordCount(e.body);
      const long  = wc > 100;
      const liked = isLiked('liked_essays', e.id);
      const cc    = e.comment_count || 0;

      card.innerHTML = `
        <div class="banana-strip" id="bananas-${e.id}">${renderLikes(e.like_count, 12)}</div>
        <div class="meta">
          ${avatarDiv(e)}
          <div class="meta-info">
            <div class="meta-name">${escHtml(e.name || 'anonymous')}</div>
            <div class="meta-time">${timeAgo(e.created_at)}</div>
          </div>
        </div>
        <h3>${escHtml(e.title)}</h3>
        <div class="card-body${long ? ' collapsed' : ''}">${escHtml(e.body)}</div>
        ${long ? '<button class="read-more">Read more</button>' : ''}
        <div class="card-divider"></div>
        <div class="card-actions">
          <button class="like-btn${liked ? ' liked' : ''}" data-id="${e.id}" data-type="essay">
            ${likeEmoji()} ${liked ? 'Liked' : 'Like'}
          </button>
          <button class="comments-toggle" id="ct-${e.id}" data-id="${e.id}">
            Comments (${cc}) \u25BE
          </button>
        </div>
        <div class="comments-section" id="cs-${e.id}" style="display:none;">
          <div class="comments-list" id="cl-${e.id}"></div>
          <div class="comment-compose">
            <div style="display:flex;align-items:flex-end;gap:6px;">
              <div class="avatar-picker-wrap">
                <button class="avatar-pick-btn comment-avatar-btn" title="Pick avatar"></button>
                <div class="avatar-dropdown comment-avatar-dd"></div>
              </div>
              <input type="text" placeholder="Your name..." id="cn-${e.id}" maxlength="40" style="flex:1;" />
            </div>
            <textarea placeholder="Add a comment..." id="cb-${e.id}" maxlength="500"></textarea>
            <button class="comment-post-btn" data-id="${e.id}">Post Comment</button>
          </div>
        </div>
      `;

      if (long) {
        const btn = card.querySelector('.read-more');
        const bd  = card.querySelector('.card-body');
        btn.addEventListener('click', () => {
          bd.classList.toggle('collapsed');
          btn.textContent = bd.classList.contains('collapsed') ? 'Read more' : 'Show less';
        });
      }

      card.querySelector('.like-btn').addEventListener('click', ev => {
        const id = parseInt(ev.currentTarget.dataset.id);
        if (!isLiked('liked_essays', id)) likePost('essays', id, ev.currentTarget);
      });

      card.querySelector('.comments-toggle').addEventListener('click', ev => {
        const id = parseInt(ev.currentTarget.dataset.id);
        const sec = $(`cs-${id}`);
        const open = sec.style.display !== 'none';
        sec.style.display = open ? 'none' : 'block';
        ev.currentTarget.textContent = `Comments (${cc}) ${open ? '\u25BE' : '\u25B4'}`;
        if (!open) fetchComments(id);
      });

      card.querySelector('.comment-post-btn').addEventListener('click', ev => {
        const id = parseInt(ev.currentTarget.dataset.id);
        postComment(id, $(`cn-${id}`).value.trim(), $(`cb-${id}`).value.trim(), ev.currentTarget);
      });

      const cBtn = card.querySelector('.comment-avatar-btn');
      const cDd  = card.querySelector('.comment-avatar-dd');
      if (cBtn && cDd) buildPicker(cBtn, cDd);

      feed.appendChild(card);
    });
  }

  async function likePost(table, id, btn) {
    try {
      const r = await fetch(`/api/${table}/${id}/like`, { method: 'POST' });
      if (!r.ok) throw 0;
      const { like_count } = await r.json();
      const key = table === 'essays' ? 'liked_essays' : 'liked_thoughts';
      markLiked(key, id);
      btn.classList.add('liked');
      btn.innerHTML = likeEmoji() + ' Liked';
      const strip = $(table === 'essays' ? `bananas-${id}` : `tbananas-${id}`);
      if (strip) strip.textContent = renderLikes(like_count, table === 'essays' ? 12 : 6);
      const arr = table === 'essays' ? essays : thoughts;
      const item = arr.find(x => x.id === id);
      if (item) item.like_count = like_count;
    } catch { showToast('Could not like — try again.'); }
  }

  async function fetchComments(essayId) {
    try {
      const r = await fetch(`/api/essays/${essayId}/comments`);
      renderComments(essayId, await r.json());
    } catch (e) { console.error(e); }
  }

  function renderComments(eid, list) {
    const el = $(`cl-${eid}`);
    if (!el) return;
    if (!list.length) { el.innerHTML = '<div class="comments-empty">No comments yet!</div>'; return; }
    el.innerHTML = list.map(c => `
      <div class="comment-item">
        ${avatarDiv(c)}
        <div class="comment-content">
          <div class="comment-meta">
            <span class="comment-name">${escHtml(c.name || 'anonymous')}</span>
            <span class="comment-time">${timeAgo(c.created_at)}</span>
          </div>
          <div class="comment-body">${escHtml(c.body)}</div>
        </div>
      </div>
    `).join('');
  }

  async function postComment(eid, name, body, btn) {
    if (!body) return;
    btn.disabled = true;
    try {
      const r = await fetch(`/api/essays/${eid}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, body, avatar: localStorage.getItem('avatarEmoji') || null })
      });
      if (!r.ok) throw 0;
      $(`cb-${eid}`).value = '';
      const essay = essays.find(e => e.id === eid);
      if (essay) {
        essay.comment_count = (essay.comment_count || 0) + 1;
        const tog = $(`ct-${eid}`);
        if (tog) tog.textContent = `Comments (${essay.comment_count}) \u25B4`;
      }
      await fetchComments(eid);
    } catch { showToast('Could not post comment.'); }
    btn.disabled = false;
  }

  $('essay-body').addEventListener('input', () => {
    const wc = wordCount($('essay-body').value);
    const el = $('essay-counter');
    el.textContent = `${wc} / 1000 words`;
    el.className = 'counter' + (wc > 1000 ? ' over' : wc > 850 ? ' warn' : '');
    $('essay-post-btn').disabled = wc === 0 || wc > 1000;
  });

  $('essay-post-btn').addEventListener('click', async () => {
    const title = $('essay-title').value.trim();
    const body  = $('essay-body').value.trim();
    const name  = $('essay-name').value.trim() || 'anonymous';
    if (!body || wordCount(body) > 1000) return;
    $('essay-post-btn').disabled = true;
    try {
      const r = await fetch('/api/essays', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, title, body, avatar: localStorage.getItem('avatarEmoji') || null })
      });
      if (!r.ok) throw 0;
      $('essay-body').value = '';
      $('essay-title').value = '';
      $('essay-body').dispatchEvent(new Event('input'));
      composeDrawer.classList.remove('open');
      composeTab.classList.remove('open');
      await fetchEssays();
      $('essays-feed').scrollTo({ top: 0, behavior: 'smooth' });
    } catch {
      showToast('Something went wrong.');
      $('essay-post-btn').disabled = false;
    }
  });

  // ── THOUGHTS ──────────────────────────────────────────────────

  async function fetchThoughts() {
    try {
      const r = await fetch('/api/thoughts');
      thoughts = await r.json();
      renderThoughts();
    } catch (e) { console.error(e); }
  }

  function renderThoughts() {
    const feed = $('thoughts-feed');
    $('thoughts-empty').style.display = thoughts.length ? 'none' : 'flex';
    feed.querySelectorAll('.thought-card').forEach(el => el.remove());

    thoughts.forEach(t => {
      const card  = document.createElement('div');
      card.className = 'thought-card';
      const liked = isLiked('liked_thoughts', t.id);

      card.innerHTML = `
        <div class="thought-banana-strip" id="tbananas-${t.id}">${renderLikes(t.like_count, 6)}</div>
        <div class="meta">
          ${avatarDiv(t)}
          <div class="meta-info">
            <div class="meta-name">${escHtml(t.name || 'anonymous')}</div>
            <div class="meta-time">${timeAgo(t.created_at)}</div>
          </div>
        </div>
        <div class="thought-body-text">${escHtml(t.body)}</div>
        <div class="thought-divider"></div>
        <div class="thought-actions">
          <button class="like-btn${liked ? ' liked' : ''}" data-id="${t.id}" data-type="thought">
            ${likeEmoji()} ${liked ? 'Liked' : 'Like'}
          </button>
        </div>
      `;

      card.querySelector('.like-btn').addEventListener('click', ev => {
        const id = parseInt(ev.currentTarget.dataset.id);
        if (!isLiked('liked_thoughts', id)) likePost('thoughts', id, ev.currentTarget);
      });

      feed.appendChild(card);
    });
  }

  $('thought-body').addEventListener('input', () => {
    const len = $('thought-body').value.length;
    const el  = $('thought-counter');
    el.textContent = `${len} / 280`;
    el.className = 'counter' + (len > 280 ? ' over' : len > 230 ? ' warn' : '');
    $('thought-post-btn').disabled = len === 0 || len > 280;
  });

  $('thought-post-btn').addEventListener('click', async () => {
    const body = $('thought-body').value.trim();
    const name = $('thought-name').value.trim() || 'anonymous';
    if (!body || body.length > 280) return;
    $('thought-post-btn').disabled = true;
    try {
      const r = await fetch('/api/thoughts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, body, avatar: localStorage.getItem('avatarEmoji') || null })
      });
      if (!r.ok) throw 0;
      $('thought-body').value = '';
      $('thought-body').dispatchEvent(new Event('input'));
      await fetchThoughts();
      $('thoughts-feed').scrollTo({ top: 0, behavior: 'smooth' });
    } catch {
      showToast('Something went wrong.');
      $('thought-post-btn').disabled = false;
    }
  });

  // ── SSE ───────────────────────────────────────────────────────
  function connectSSE() {
    const es = new EventSource('/api/events');

    es.addEventListener('essay',   () => fetchEssays());
    es.addEventListener('thought', () => fetchThoughts());

    es.addEventListener('like', (e) => {
      const { essay_id, like_count } = JSON.parse(e.data);
      const strip = $(`bananas-${essay_id}`);
      if (strip) strip.textContent = renderLikes(like_count, 12);
      const essay = essays.find(x => x.id === essay_id);
      if (essay) essay.like_count = like_count;
    });

    es.addEventListener('thought_like', (e) => {
      const { thought_id, like_count } = JSON.parse(e.data);
      const strip = $(`tbananas-${thought_id}`);
      if (strip) strip.textContent = renderLikes(like_count, 6);
      const thought = thoughts.find(x => x.id === thought_id);
      if (thought) thought.like_count = like_count;
    });

    es.addEventListener('comment', (e) => {
      const { essay_id } = JSON.parse(e.data);
      const essay = essays.find(x => x.id === essay_id);
      if (essay) {
        essay.comment_count = (essay.comment_count || 0) + 1;
        const tog = $(`ct-${essay_id}`);
        if (tog) {
          const open = $(`cs-${essay_id}`)?.style.display !== 'none';
          tog.textContent = `Comments (${essay.comment_count}) ${open ? '\u25B4' : '\u25BE'}`;
        }
        if ($(`cs-${essay_id}`)?.style.display !== 'none') fetchComments(essay_id);
      }
    });

    es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
  }

  // ── INIT ──────────────────────────────────────────────────────
  fetchEssays();
  fetchThoughts();
  connectSSE();

  // ── GRAFFITI WALL ─────────────────────────────────────────────
  const wallOverlay = $('wallOverlay');
  const infoOverlay = $('infoOverlay');

  $('infoBtn').addEventListener('click',  () => infoOverlay.classList.add('open'));
  $('infoClose').addEventListener('click', () => infoOverlay.classList.remove('open'));
  infoOverlay.addEventListener('click', e => { if (e.target === infoOverlay) infoOverlay.classList.remove('open'); });
  const wallCanvas  = $('wallCanvas');
  const ctx         = wallCanvas.getContext('2d');
  const CANVAS_W    = 1200;
  const CANVAS_H    = 625;
  wallCanvas.width  = CANVAS_W;
  wallCanvas.height = CANVAS_H;

  function replayStrokes(strokes) {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#fdf8ff';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    strokes.forEach(s => {
      const pts = s.points;
      if (!pts || pts.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = '#2d1a4a';
      ctx.lineWidth   = 3;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    });
  }

  async function loadWall() {
    try {
      const r = await fetch('/api/canvas');
      const strokes = await r.json();
      replayStrokes(strokes);
    } catch { }
  }

  let drawing = false;
  let currentStroke = [];

  function canvasPos(e) {
    const rect  = wallCanvas.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    const src   = e.touches ? e.touches[0] : e;
    return {
      x: Math.round((src.clientX - rect.left) * scaleX),
      y: Math.round((src.clientY - rect.top)  * scaleY)
    };
  }

  function startDraw(e) {
    drawing = true;
    currentStroke = [canvasPos(e)];
    ctx.beginPath();
    ctx.strokeStyle = '#2d1a4a';
    ctx.lineWidth   = 3;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    const p = currentStroke[0];
    ctx.moveTo(p.x, p.y);
  }

  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = canvasPos(e);
    currentStroke.push(p);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  async function endDraw() {
    if (!drawing) return;
    drawing = false;
    if (currentStroke.length < 2) return;
    try {
      await fetch('/api/canvas/stroke', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ points: currentStroke })
      });
    } catch { }
    currentStroke = [];
  }

  wallCanvas.addEventListener('mousedown',  startDraw);
  wallCanvas.addEventListener('mousemove',  moveDraw);
  wallCanvas.addEventListener('mouseup',    endDraw);
  wallCanvas.addEventListener('mouseleave', endDraw);
  wallCanvas.addEventListener('touchstart', startDraw, { passive: false });
  wallCanvas.addEventListener('touchmove',  moveDraw,  { passive: false });
  wallCanvas.addEventListener('touchend',   endDraw);

  $('wallBtn').addEventListener('click', () => {
    wallOverlay.classList.add('open');
    loadWall();
  });

  $('wallClose').addEventListener('click', () => wallOverlay.classList.remove('open'));

  wallOverlay.addEventListener('click', e => { if (e.target === wallOverlay) wallOverlay.classList.remove('open'); });
</script>
</body>
